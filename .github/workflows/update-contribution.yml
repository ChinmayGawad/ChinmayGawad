name: Update GitHub Contribution Animation

on:
  schedule:
    - cron: '0 */4 * * *'  # Automatically run every 4 hours
  workflow_dispatch:      # Enable manual run from GitHub Actions UI
  push:
    branches:
      - main

permissions:
  contents: write

jobs:
  update-contribution:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Install Playwright Chromium with system dependencies
        run: npx playwright install --with-deps chromium

      - name: Generate Contribution Animation and Heatmaps
        env:
          GITHUB_USERNAME: ${{ github.repository_owner }}
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          npm run generate
          node generate.js

      - name: Commit and Push if changed
        uses: stefanzweifel/git-auto-commit-action@v5
        with:
          commit_message: "chore: auto-update contribution wash animation and SVGs"
          file_pattern: "assets/* *.svg README.md"
          commit_user_name: "github-actions[bot]"
          commit_user_email: "github-actions[bot]@users.noreply.github.com"
          commit_author: "github-actions[bot] <github-actions[bot]@users.noreply.github.com>"

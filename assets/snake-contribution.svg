<svg xmlns="http://www.w3.org/2000/svg" width="900" height="250" viewBox="0 0 900 250">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#0d1117"/>
      <stop offset="100%" stop-color="#161b22"/>
    </linearGradient>
    <filter id="glow">
      <feGaussianBlur stdDeviation="3" result="blur"/>
      <feMerge>
        <feMergeNode in="blur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>

    <!-- Slithering Snake Motion Path -->
    <path id="snake-path" d="M 65,85 L 65,165 L 90,165 L 90,85 L 115,85 L 115,165 L 140,165 L 140,85 L 165,85 L 165,165 L 190,165 L 190,85 L 215,85 L 215,165 L 240,165 L 240,85 L 265,85 L 265,165 L 290,165 L 290,85 L 315,85 L 315,165 L 340,165 L 340,85 L 365,85 L 365,165 L 390,165 L 390,85 L 415,85 L 415,165 L 440,165 L 440,85 L 465,85 L 465,165 L 490,165 L 490,85 L 515,85 L 515,165 L 540,165 L 540,85 L 565,85 L 565,165 L 590,165 L 590,85 L 615,85 L 615,165 L 640,165 L 640,85 L 665,85 L 665,165 L 690,165 L 690,85 L 715,85 L 715,165 L 740,165 Z" fill="none"/>
  </defs>

  <!-- Main Terminal Card Frame -->
  <rect width="900" height="250" rx="12" fill="url(#bg)" stroke="#30363d" stroke-width="1.5"/>
  <rect width="896" height="246" x="2" y="2" rx="10" fill="none" stroke="#00FF66" stroke-width="0.75" opacity="0.4"/>

  <!-- Terminal Window Header Bar -->
  <path d="M 0,12 A 12,12 0 0,1 12,0 L 888,0 A 12,12 0 0,1 900,12 L 900,36 L 0,36 Z" fill="#161b22"/>
  <line x1="0" y1="36" x2="900" y2="36" stroke="#30363d" stroke-width="1"/>

  <!-- Control Dots -->
  <circle cx="24" cy="18" r="5" fill="#ff5f56"/>
  <circle cx="40" cy="18" r="5" fill="#ffbd2e"/>
  <circle cx="56" cy="18" r="5" fill="#27c93f"/>
  <text x="76" y="22" font-family="'Fira Code', 'Courier New', monospace" font-size="12" fill="#8b949e">terminal ~ live_snake_contribution.sys (zsh)</text>

  <!-- Header Title -->
  <text x="450" y="60" text-anchor="middle" font-family="'Fira Code', 'Courier New', monospace" font-size="15" font-weight="bold" fill="#00FF66" filter="url(#glow)">🐍 LIVE GITHUB CONTRIBUTION SNAKE MATRIX</text>

  <!-- 52-Week Matrix Grid Background -->
  <g transform="translate(60, 80)">
    <g fill="#0e4429" stroke="#0d1117" stroke-width="1.5">
      <rect x="0" y="0" width="11" height="11" rx="2" fill="#26a641"/>
      <rect x="0" y="15" width="11" height="11" rx="2" fill="#006d32"/>
      <rect x="0" y="30" width="11" height="11" rx="2" fill="#0e4429"/>
      <rect x="0" y="45" width="11" height="11" rx="2" fill="#26a641"/>
      <rect x="0" y="60" width="11" height="11" rx="2" fill="#006d32"/>
      <rect x="0" y="75" width="11" height="11" rx="2" fill="#00FF66" filter="url(#glow)"/>

      <rect x="15" y="0" width="11" height="11" rx="2" fill="#006d32"/>
      <rect x="15" y="15" width="11" height="11" rx="2" fill="#00FF66" filter="url(#glow)"/>
      <rect x="15" y="30" width="11" height="11" rx="2" fill="#26a641"/>
      <rect x="15" y="45" width="11" height="11" rx="2" fill="#0e4429"/>
      <rect x="15" y="60" width="11" height="11" rx="2" fill="#00FF66" filter="url(#glow)"/>
      <rect x="15" y="75" width="11" height="11" rx="2" fill="#26a641"/>

      <!-- Matrix Grid Outer Frame -->
      <rect x="30" y="0" width="750" height="88" rx="4" fill="none" stroke="#00FF66" stroke-width="1" stroke-dasharray="6,4" opacity="0.3"/>
      <text x="400" y="48" font-family="'Fira Code', 'Courier New', monospace" font-size="13" font-weight="bold" fill="#00FF66" text-anchor="middle">🐍 2,218 COMMITS EATEN BY ANIMATED SNAKE</text>
    </g>
  </g>

  <!-- Animated Green Snake Slithering Follower -->
  <g>
    <!-- Snake Head -->
    <g transform="translate(-6, -6)">
      <circle cx="6" cy="6" r="7" fill="#00FF66" filter="url(#glow)"/>
      <circle cx="9" cy="4" r="1.5" fill="#0d1117"/>
      <animateMotion dur="10s" rotate="auto" repeatCount="indefinite">
        <mpath href="#snake-path"/>
      </animateMotion>
    </g>
    <!-- Snake Body Segment 1 -->
    <g transform="translate(-6, -6)">
      <circle cx="6" cy="6" r="6" fill="#26a641" opacity="0.9"/>
      <animateMotion dur="10s" begin="0.08s" rotate="auto" repeatCount="indefinite">
        <mpath href="#snake-path"/>
      </animateMotion>
    </g>
    <!-- Snake Body Segment 2 -->
    <g transform="translate(-6, -6)">
      <circle cx="6" cy="6" r="5" fill="#006d32" opacity="0.8"/>
      <animateMotion dur="10s" begin="0.16s" rotate="auto" repeatCount="indefinite">
        <mpath href="#snake-path"/>
      </animateMotion>
    </g>
    <!-- Snake Body Segment 3 -->
    <g transform="translate(-6, -6)">
      <circle cx="6" cy="6" r="4" fill="#0e4429" opacity="0.7"/>
      <animateMotion dur="10s" begin="0.24s" rotate="auto" repeatCount="indefinite">
        <mpath href="#snake-path"/>
      </animateMotion>
    </g>
  </g>

  <!-- Caption Footer -->
  <text x="450" y="215" text-anchor="middle" font-family="'Fira Code', 'Courier New', monospace" font-size="12" fill="#8b949e">
    GITHUB SNAKE ANIMATION :: 60FPS matrix green snake eating contribution dots.
  </text>
</svg>

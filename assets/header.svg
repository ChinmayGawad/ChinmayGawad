<svg xmlns="http://www.w3.org/2000/svg" width="960" height="220" viewBox="0 0 960 220" role="img" aria-label="Chinmay Gawad - Computer Engineering Student, Android Developer, AI/ML Enthusiast">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#011627"/>
      <stop offset="0.55" stop-color="#0b2b44"/>
      <stop offset="1" stop-color="#122d4f"/>
    </linearGradient>
    <linearGradient id="accent" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#7fdbca"/>
      <stop offset="0.5" stop-color="#82aaff"/>
      <stop offset="1" stop-color="#c792ea"/>
    </linearGradient>
    <radialGradient id="glow1" cx="0.15" cy="0.15" r="0.7">
      <stop offset="0" stop-color="#c792ea" stop-opacity="0.28"/>
      <stop offset="1" stop-color="#c792ea" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="glow2" cx="0.9" cy="0.9" r="0.7">
      <stop offset="0" stop-color="#82aaff" stop-opacity="0.25"/>
      <stop offset="1" stop-color="#82aaff" stop-opacity="0"/>
    </radialGradient>
    <pattern id="dots" width="34" height="34" patternUnits="userSpaceOnUse">
      <circle cx="2" cy="2" r="1.4" fill="#2d4a68" opacity="0.7"/>
    </pattern>
  </defs>

  <rect width="960" height="220" rx="18" fill="url(#bg)"/>
  <rect width="960" height="220" rx="18" fill="url(#glow1)"/>
  <rect width="960" height="220" rx="18" fill="url(#glow2)"/>
  <rect width="960" height="220" rx="18" fill="url(#dots)"/>

  <!-- decorative code brackets -->
  <g font-family="JetBrains Mono, Consolas, monospace" font-weight="700" fill="#2d4a68" opacity="0.9">
    <text x="40" y="182" font-size="120">&lt;/&gt;</text>
  </g>
  <g font-family="JetBrains Mono, Consolas, monospace" font-weight="700" fill="#c792ea" opacity="0.14">
    <text x="752" y="88" font-size="150">{ }</text>
  </g>

  <!-- name -->
  <text x="480" y="98" text-anchor="middle" font-family="JetBrains Mono, Consolas, monospace" font-size="48" font-weight="700" letter-spacing="3" fill="#d6deeb">CHINMAY GAWAD</text>

  <!-- accent underline -->
  <rect x="340" y="120" width="280" height="4" rx="2" fill="url(#accent)"/>

  <!-- tagline -->
  <text x="480" y="156" text-anchor="middle" font-family="Segoe UI, Arial, sans-serif" font-size="20" fill="#9fb4c8">Computer Engineering Student · Android Developer · AI/ML Enthusiast</text>

  <!-- accent marker -->
  <circle cx="480" cy="186" r="3" fill="#7fdbca"/>
</svg>

<svg xmlns="http://www.w3.org/2000/svg" width="900" height="160" viewBox="0 0 900 160">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#0d1117"/>
      <stop offset="100%" stop-color="#161b22"/>
    </linearGradient>
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="3" result="blur"/>
      <feMerge>
        <feMergeNode in="blur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
  </defs>

  <!-- Background Box -->
  <rect width="900" height="160" rx="12" fill="url(#bg)" stroke="#30363d" stroke-width="1.5"/>
  <rect width="896" height="156" x="2" y="2" rx="10" fill="none" stroke="#00FF66" stroke-width="0.75" opacity="0.4"/>

  <!-- Top Bar -->
  <path d="M 0,12 A 12,12 0 0,1 12,0 L 888,0 A 12,12 0 0,1 900,12 L 900,34 L 0,34 Z" fill="#161b22"/>
  <line x1="0" y1="34" x2="900" y2="34" stroke="#30363d" stroke-width="1"/>

  <!-- Window Dots -->
  <circle cx="24" cy="17" r="5" fill="#ff5f56"/>
  <circle cx="40" cy="17" r="5" fill="#ffbd2e"/>
  <circle cx="56" cy="17" r="5" fill="#27c93f"/>
  <text x="76" y="21" font-family="'Fira Code', 'Courier New', monospace" font-size="12" fill="#8b949e">matrix ~ main_header.sh</text>

  <!-- Large Bold Typography Title -->
  <g font-family="'Fira Code', 'JetBrains Mono', 'Courier New', monospace" font-weight="900" filter="url(#glow)">
    <text x="450" y="95" font-size="44" letter-spacing="4" text-anchor="middle" fill="#00FF66">CHINMAY GAWAD</text>
  </g>

  <!-- Subtitle Tagline -->
  <text x="450" y="132" text-anchor="middle" font-family="'Fira Code', 'Courier New', monospace" font-size="14" font-weight="600" fill="#8b949e">
    &lt;/&gt; B.Tech COMPUTER ENGINEERING · <tspan fill="#00FF66">ANDROID DEV &amp; AI/ML ENGINEER</tspan>
  </text>
</svg>
